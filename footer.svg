<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="120">
  <defs>
    <linearGradient id="bgF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="lineF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="gridF" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1F2937" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="120" fill="url(#bgF)"/>
  <rect width="1000" height="120" fill="url(#gridF)" opacity="0.35"/>

  <line x1="130" y1="42" x2="870" y2="42" stroke="url(#lineF)" stroke-width="1.2" opacity="0.7"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#7C8AA0" letter-spacing="1.5">
    <circle cx="130" cy="42" r="4" fill="#38BDF8"/>
    <text x="130" y="65" text-anchor="middle">DATA</text>

    <circle cx="315" cy="42" r="4" fill="#38BDF8"/>
    <text x="315" y="65" text-anchor="middle">QUERY</text>

    <circle cx="500" cy="42" r="4" fill="#6366F1"/>
    <text x="500" y="65" text-anchor="middle">TRANSFORM</text>

    <circle cx="685" cy="42" r="4" fill="#A78BFA"/>
    <text x="685" y="65" text-anchor="middle">VISUALIZE</text>

    <circle cx="870" cy="42" r="4" fill="#A78BFA"/>
    <text x="870" y="65" text-anchor="middle">INSIGHT</text>
  </g>

  <text x="500" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="12" fill="#CBD5E1">Building with data. Learning continuously.</text>
</svg>
