        M400,20 C460,5 520,20 545,55 C570,90 550,130 495,140 C440,150 360,150 305,138 C250,126 245,85 268,50 C291,15 340,35 400,20Z;
        M400,15 C465,0 525,25 548,62 C571,99 548,138 490,145 C432,152 350,145 298,130 C246,115 242,72 268,42 C294,12 335,30 400,15Z;
        M400,22 C458,8 515,18 542,52 C569,86 552,128 498,142 C444,156 355,148 302,134 C249,120 248,80 272,48 C296,16 342,36 400,22Z;
        M400,20 C460,5 520,20 545,55 C570,90 550,130 495,140 C440,150 360,150 305,138 C250,126 245,85 268,50 C291,15 340,35 400,20Z"
    />
