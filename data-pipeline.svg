<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#131A24"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
    <pattern id="gridP" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1B2432" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="240" fill="url(#bgP)"/>
  <rect width="1000" height="240" fill="url(#gridP)" opacity="0.4"/>

  <!-- connecting line -->
  <line x1="110" y1="120" x2="890" y2="120" stroke="#243244" stroke-width="1.5"/>

  <!-- 5 stage cards -->
  <!-- Stage 1: SQL Server -->
  <g transform="translate(50,70)">
    <rect width="130" height="100" rx="12" fill="#111826" stroke="url(#cardStroke)" stroke-width="1.2"/>
    <g transform="translate(65,32)">
      <ellipse cx="0" cy="0" rx="20" ry="6" fill="none" stroke="#38BDF8" stroke-width="1.3"/>
      <path d="M -20 0 L -20 24 A 20 6 0 0 0 20 24 L 20 0" fill="none" stroke="#38BDF8" stroke-width="1.3"/>
      <ellipse cx="0" cy="24" rx="20" ry="6" fill="none" stroke="#38BDF8" stroke-width="1.3"/>
    </g>
    <text x="65" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#F1F5F9">SQL SERVER</text>
  </g>

  <!-- Stage 2: SSIS / ETL -->
  <g transform="translate(228,70)">
    <rect width="130" height="100" rx="12" fill="#111826" stroke="url(#cardStroke)" stroke-width="1.2"/>
    <g transform="translate(65,34)" stroke="#6366F1" stroke-width="1.3" fill="none">
      <rect x="-22" y="-10" width="16" height="16" rx="2"/>
      <rect x="6" y="-10" width="16" height="16" rx="2"/>
      <path d="M -6 -2 L 6 -2" marker-end="url(#arrowP)"/>
      <path d="M -14 6 L -14 18 L 14 18 L 14 6" />
    </g>
    <text x="65" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#F1F5F9">SSIS / ETL</text>
  </g>

  <!-- Stage 3: Databricks -->
  <g transform="translate(406,70)">
    <rect width="130" height="100" rx="12" fill="#111826" stroke="url(#cardStroke)" stroke-width="1.2"/>
    <g transform="translate(65,32)" fill="#A78BFA">
      <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="none" stroke="#A78BFA" stroke-width="1.3"/>
      <circle cx="0" cy="0" r="3" fill="#A78BFA"/>
    </g>
    <text x="65" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#F1F5F9">DATABRICKS</text>
  </g>

  <!-- Stage 4: Power BI -->
  <g transform="translate(584,70)">
    <rect width="130" height="100" rx="12" fill="#111826" stroke="url(#cardStroke)" stroke-width="1.2"/>
    <g transform="translate(48,42)">
      <rect x="0" y="-6" width="8" height="16" fill="#F2C811"/>
      <rect x="12" y="-16" width="8" height="26" fill="#F2C811"/>
      <rect x="24" y="-24" width="8" height="34" fill="#F2C811"/>
      <rect x="36" y="-12" width="8" height="22" fill="#F2C811"/>
    </g>
    <text x="65" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#F1F5F9">POWER BI</text>
  </g>

  <!-- Stage 5: Insights -->
  <g transform="translate(762,70)">
    <rect width="130" height="100" rx="12" fill="#111826" stroke="url(#cardStroke)" stroke-width="1.2"/>
    <g transform="translate(65,34)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#1E293B" stroke-width="5"/>
      <circle cx="0" cy="0" r="16" fill="none" stroke="#22D3EE" stroke-width="5"
              stroke-dasharray="70 100" stroke-linecap="round" transform="rotate(-90)"/>
    </g>
    <text x="65" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#F1F5F9">INSIGHTS</text>
  </g>

  <!-- arrows between cards -->
  <g stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrowP)" opacity="0.85">
    <line x1="182" y1="120" x2="222" y2="120"/>
    <line x1="360" y1="120" x2="400" y2="120"/>
    <line x1="538" y1="120" x2="578" y2="120"/>
    <line x1="716" y1="120" x2="756" y2="120"/>
  </g>
</svg>
