<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#131A24"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
    <pattern id="gridP" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1B2432" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="240" fill="url(#bgP)"/>
  <rect width="1000" height="240" fill="url(#gridP)" opacity="0.4"/>

  <line x1="120" y1="120" x2="880" y2="120" stroke="#243244" stroke-width="1.5"/>

  <!-- Stage 1: SQL Server -->
  <g transform="translate(80,70)">
    <rect width="150" height="100" rx="12" fill="#111826" stroke="url(#cardStroke)" stroke-width="1.2"/>
    <g transform="translate(75,32)">
      <ellipse cx="0" cy="0" rx="22" ry="6" fill="none" stroke="#38BDF8" stroke-width="1.3"/>
      <path d="M -22 0 L -22 24 A 22 6 0 0 0 22 24 L 22 0" fill="none" stroke="#38BDF8" stroke-width="1.3"/>
      <ellipse cx="0" cy="24" rx="22" ry="6" fill="none" stroke="#38BDF8" stroke-width="1.3"/>
    </g>
    <text x="75" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">SQL SERVER</text>
  </g>

  <!-- Stage 2: SSIS / ETL -->
  <g transform="translate(292,70)">
    <rect width="150" height="100" rx="12" fill="#111826" stroke="url(#cardStroke)" stroke-width="1.2"/>
    <g transform="translate(75,34)" stroke="#6366F1" stroke-width="1.3" fill="none">
      <rect x="-24" y="-10" width="16" height="16" rx="2"/>
      <rect x="8" y="-10" width="16" height="16" rx="2"/>
      <path d="M -8 -2 L 8 -2" marker-end="url(#arrowP)"/>
      <path d="M -16 6 L -16 18 L 16 18 L 16 6" />
    </g>
    <text x="75" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">SSIS / ETL</text>
  </g>

  <!-- Stage 3: Power BI -->
  <g transform="translate(504,70)">
    <rect width="150" height="100" rx="12" fill="#111826" stroke="url(#cardStroke)" stroke-width="1.2"/>
    <g transform="translate(58,42)">
      <rect x="0" y="-6" width="8" height="16" fill="#F2C811"/>
      <rect x="12" y="-16" width="8" height="26" fill="#F2C811"/>
      <rect x="24" y="-24" width="8" height="34" fill="#F2C811"/>
      <rect x="36" y="-12" width="8" height="22" fill="#F2C811"/>
    </g>
    <text x="75" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">POWER BI</text>
  </g>

  <!-- Stage 4: Insights -->
  <g transform="translate(716,70)">
    <rect width="150" height="100" rx="12" fill="#111826" stroke="url(#cardStroke)" stroke-width="1.2"/>
    <g transform="translate(75,34)">
      <circle cx="0" cy="0" r="17" fill="none" stroke="#1E293B" stroke-width="5"/>
      <circle cx="0" cy="0" r="17" fill="none" stroke="#22D3EE" stroke-width="5"
              stroke-dasharray="74 107" stroke-linecap="round" transform="rotate(-90)"/>
    </g>
    <text x="75" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#F1F5F9">INSIGHTS</text>
  </g>

  <!-- arrows between cards -->
  <g stroke="#38BDF8" stroke-width="1.6" marker-end="url(#arrowP)" opacity="0.85">
    <line x1="232" y1="120" x2="284" y2="120"/>
    <line x1="444" y1="120" x2="496" y2="120"/>
    <line x1="656" y1="120" x2="708" y2="120"/>
  </g>
</svg>
