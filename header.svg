<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1F2937" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <rect width="1000" height="200" fill="url(#bg)"/>
  <rect width="1000" height="200" fill="url(#grid)" opacity="0.45"/>

  <!-- faint SQL code texture, top-left -->
  <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#334155" opacity="0.8">
    <text x="18" y="28">SELECT region, SUM(revenue)</text>
    <text x="18" y="44">FROM sales_fact f</text>
    <text x="18" y="60">JOIN dim_date d ON d.id = f.date_id</text>
    <text x="18" y="76">GROUP BY region;</text>
  </g>

  <!-- database cylinder -->
  <g transform="translate(90,70)">
    <ellipse cx="0" cy="0" rx="34" ry="10" fill="none" stroke="#38BDF8" stroke-width="1.4" opacity="0.9"/>
    <path d="M -34 0 L -34 46 A 34 10 0 0 0 34 46 L 34 0" fill="none" stroke="#38BDF8" stroke-width="1.4" opacity="0.9"/>
    <ellipse cx="0" cy="46" rx="34" ry="10" fill="none" stroke="#38BDF8" stroke-width="1.4" opacity="0.9"/>
    <path d="M -34 15 A 34 10 0 0 0 34 15" fill="none" stroke="#1E3A52" stroke-width="1"/>
    <path d="M -34 31 A 34 10 0 0 0 34 31" fill="none" stroke="#1E3A52" stroke-width="1"/>
  </g>

  <!-- flow path from database through nodes to chart to KPI card -->
  <path d="M 140 95 C 230 95, 260 60, 340 70 S 460 130, 540 95 S 640 55, 720 80"
        fill="none" stroke="url(#flow)" stroke-width="1.6" opacity="0.75" marker-end="url(#arrow)"/>

  <circle cx="245" cy="72" r="4" fill="#38BDF8"/>
  <circle cx="345" cy="72" r="3.5" fill="#6366F1"/>
  <circle cx="450" cy="118" r="4" fill="#38BDF8"/>
  <circle cx="545" cy="96" r="3.5" fill="#A78BFA"/>
  <circle cx="635" cy="58" r="4" fill="#38BDF8"/>

  <!-- bar chart glyph -->
  <g transform="translate(560,120)">
    <rect x="0"  y="30" width="9" height="20" fill="url(#barGrad)" opacity="0.9"/>
    <rect x="13" y="18" width="9" height="32" fill="url(#barGrad)" opacity="0.9"/>
    <rect x="26" y="6"  width="9" height="44" fill="url(#barGrad)" opacity="0.9"/>
    <rect x="39" y="22" width="9" height="28" fill="url(#barGrad)" opacity="0.9"/>
  </g>

  <!-- line chart glyph -->
  <polyline points="650,140 670,120 690,132 710,105 730,118 750,92"
            fill="none" stroke="#22D3EE" stroke-width="1.6" opacity="0.85"/>
  <circle cx="750" cy="92" r="3" fill="#22D3EE"/>

  <!-- KPI / insight card -->
  <g transform="translate(800,55)">
    <rect x="0" y="0" width="150" height="90" rx="10" fill="#111826" stroke="#2A3546" stroke-width="1"/>
    <circle cx="34" cy="34" r="18" fill="none" stroke="#1E293B" stroke-width="6"/>
    <circle cx="34" cy="34" r="18" fill="none" stroke="#38BDF8" stroke-width="6"
            stroke-dasharray="80 113" stroke-linecap="round" transform="rotate(-90 34 34)"/>
    <rect x="64" y="18" width="70" height="7" rx="3.5" fill="#2A3546"/>
    <rect x="64" y="32" width="50" height="7" rx="3.5" fill="#1E293B"/>
    <rect x="18" y="62" width="114" height="1" fill="#1F2937"/>
    <rect x="18" y="72" width="34" height="6" rx="3" fill="#A78BFA" opacity="0.85"/>
    <rect x="58" y="72" width="34" height="6" rx="3" fill="#38BDF8" opacity="0.85"/>
    <rect x="98" y="72" width="34" height="6" rx="3" fill="#22D3EE" opacity="0.85"/>
  </g>

  <!-- scattered subtle data points, right edge -->
  <g opacity="0.5">
    <circle cx="965" cy="30" r="2.5" fill="#38BDF8"/>
    <circle cx="980" cy="55" r="2" fill="#A78BFA"/>
    <circle cx="960" cy="80" r="2" fill="#38BDF8"/>
    <circle cx="985" cy="150" r="2.5" fill="#6366F1"/>
    <circle cx="955" cy="175" r="2" fill="#38BDF8"/>
  </g>
</svg>
