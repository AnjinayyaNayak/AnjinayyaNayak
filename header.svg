<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="blobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161B22;stop-opacity:1" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" fill="url(#bgGrad)"/>

  <!-- Blob glow behind -->
  <path filter="url(#blur)" fill="url(#blobGrad)" opacity="0.4">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M400,80 C460,60 520,80 540,130 C560,180 540,240 490,260 C440,280 360,280 310,255 C260,230 250,170 270,120 C290,70 340,100 400,80Z;
        M400,70 C470,55 530,90 545,145 C560,200 530,255 475,268 C420,281 345,270 295,240 C245,210 245,155 268,105 C291,55 330,85 400,70Z;
        M400,85 C455,65 510,75 535,125 C560,175 545,245 495,262 C445,279 355,275 305,248 C255,221 252,162 275,115 C298,68 345,105 400,85Z;
        M400,80 C460,60 520,80 540,130 C560,180 540,240 490,260 C440,280 360,280 310,255 C260,230 250,170 270,120 C290,70 340,100 400,80Z"
    />
  </path>

  <!-- Main Blob -->
  <path fill="url(#blobGrad)" opacity="0.95">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M400,80 C460,60 520,80 540,130 C560,180 540,240 490,260 C440,280 360,280 310,255 C260,230 250,170 270,120 C290,70 340,100 400,80Z;
        M400,70 C470,55 530,90 545,145 C560,200 530,255 475,268 C420,281 345,270 295,240 C245,210 245,155 268,105 C291,55 330,85 400,70Z;
        M400,85 C455,65 510,75 535,125 C560,175 545,245 495,262 C445,279 355,275 305,248 C255,221 252,162 275,115 C298,68 345,105 400,85Z;
        M400,80 C460,60 520,80 540,130 C560,180 540,240 490,260 C440,280 360,280 310,255 C260,230 250,170 270,120 C290,70 340,100 400,80Z"
    />
  </path>

  <!-- Name Text on blob -->
  <text x="400" y="158" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
    font-size="32" font-weight="bold" fill="white" opacity="1">
    Anjinayya Nayak
  </text>

  <!-- Sub text on blob -->
  <text x="400" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
    font-size="13" fill="white" opacity="0.9">
    Power BI | SQL | Python | Tableau | Looker Studio
  </text>

</svg>
